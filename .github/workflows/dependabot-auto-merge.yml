name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Enable auto-merge for Dependabot
    # Runs only on Dependabot's own pull requests from this repository against
    # the default branch. The pull request author is the condition recommended
    # by zizmor: the actor contexts are spoofable. Runs of Dependabot-initiated
    # events receive Dependabot secrets, and a manual re-run keeps them even
    # when a person starts it; a new event initiated by a person (a reopen, for
    # example) receives Actions secrets and finds no token, and so does a run in
    # a repository where the Dependabot secret was never configured. Both cases
    # fail visibly below.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The token is a fine-grained personal access token stored as a Dependabot
      # secret (Contents, Pull requests and Workflows: read and write). The
      # built-in Actions token is never used, so the merge performed later by
      # GitHub triggers the default-branch workflows normally.
      # --match-head-commit binds the arming request to the exact head of this
      # event. A missing token fails the job instead of passing silently, so a
      # rollout error is visible; a pull request whose event was initiated by a
      # person is armed again on the next Dependabot synchronization or after
      # "@dependabot recreate".
      - name: Enable GitHub native auto-merge with squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_AUTOMERGE_TOKEN is not available in this run: either the Dependabot secret is not configured, or this event was initiated by a person and received Actions secrets (a manual re-run of a Dependabot-initiated run keeps that run's Dependabot secrets, so the re-run reaches this message only when the secret is not configured). Auto-merge is armed again on the next Dependabot synchronization or after '@dependabot recreate'."
            exit 1
          fi
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
