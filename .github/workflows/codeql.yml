name: CodeQL
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '11 6 * * 2'
permissions: write-all
concurrency:
  group: codeql-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  analyze:
    permissions: write-all
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          dependency-caching: true
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:${{ matrix.language }}'
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce zero CodeQL findings
        shell: bash
        env:
          CODEQL_RESULTS: ${{ runner.temp }}/codeql-results
        run: |
          set -euo pipefail
          mapfile -d '' sarif_files < <(
            find "$CODEQL_RESULTS" -type f -name '*.sarif' -print0
          )
          if [ "${#sarif_files[@]}" -eq 0 ]; then
            echo "::error::CodeQL produced no SARIF file to enforce." >&2
            exit 1
          fi
          finding_count="$(
            jq -s '[.[].runs[]?.results[]?] | length' "${sarif_files[@]}"
          )"
          if [ "$finding_count" -ne 0 ]; then
            echo "::error::CodeQL reported $finding_count active finding(s); zero are allowed." >&2
            exit 1
          fi
          echo "CodeQL reported zero active findings."
