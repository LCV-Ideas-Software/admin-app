name: Dependabot Automerge

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions: write-all

jobs:
  dependabot-automerge:
    name: Process Dependabot pull requests
    runs-on: ubuntu-latest
    permissions: write-all
    environment: dependabot-automation
    timeout-minutes: 10
    steps:
      - name: Process one guarded queue mutation
        uses: LCV-Ideas-Software/.github/dependabot-automerge@aeb0bba0fc26df8203eada443126c5850438107a
        with:
          github_token: ${{ github.token }}
          automation_token: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          required_checks_json: '[{"name":"Dependency Review","app_id":15368},{"name":"Check index.html formatting","app_id":15368},{"name":"CodeQL","app_id":57789},{"name":"zizmor","app_id":57789}]'

concurrency:
  group: dependabot-automerge-${{ github.repository }}
  queue: max
  cancel-in-progress: false
