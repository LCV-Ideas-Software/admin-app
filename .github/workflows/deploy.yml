# This workflow is managed by gh actions-lock.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_OPTIONS: '--no-deprecation'

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy application
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: cloudflare-production
    permissions:
      contents: read # Deploy the exact source revision from the protected branch.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Verify npm registry
        shell: bash
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tlsrpt-motor --ignore-scripts --no-audit --no-fund

      - name: Validate admin application
        run: |
          npm audit --audit-level=high
          npm run verify:thirdparty
          npm run lint
          npm run biome
          npm test
          npm run test:admin-motor
          npm run typecheck:admin-motor
          npm run build
          npm run verify:thirdparty:artifact
          npm run format:public:check

      - name: Validate TLS-RPT Motor
        working-directory: tlsrpt-motor
        run: |
          npm audit --audit-level=high
          npm run lint
          npm test

      - name: Validate Worker deployment artifacts
        run: |
          npm exec -- wrangler deploy --dry-run --strict --cwd tlsrpt-motor --outdir dist/legal-audit --metafile
          npm exec -- wrangler deploy --dry-run --strict --cwd admin-motor --outdir dist/legal-audit --metafile
          npm run verify:thirdparty:worker-artifacts

      - name: Apply D1 migrations with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.125.0
          command: d1 migrations apply BIGDATA_DB --remote --config wrangler.json

      - name: Deploy TLS-RPT Motor with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.125.0
          workingDirectory: tlsrpt-motor
          command: deploy --strict

      - name: Deploy Admin Motor with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.125.0
          command: deploy --strict --config admin-motor/wrangler.json

      - name: Deploy Admin Pages with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.125.0
          command: pages deploy dist --project-name=admin-app --branch=main
