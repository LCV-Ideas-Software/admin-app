name: Public Format
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
permissions: write-all
jobs:
  prettier-public:
    permissions: write-all
    name: Check index.html formatting
    environment: ci-automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check public page formatting
        run: npm run format:public:check
      - name: Lint application
        run: npm run lint
      - name: Check Biome policy
        run: npm run biome
      - name: Run frontend tests
        run: npm test
      - name: Run admin-motor tests
        run: npm run test:admin-motor
      - name: Typecheck admin-motor
        run: npm run typecheck:admin-motor
      - name: Build production application
        run: npm run build
    timeout-minutes: 30
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false
