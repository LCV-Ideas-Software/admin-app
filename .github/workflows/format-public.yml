# This workflow is managed by gh actions-lock.

name: Public Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested

permissions: {}

concurrency:
  group: public-format-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prettier-public:
    name: Check index.html formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Read the exact candidate tree.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate application
        run: |
          npm run format:public:check
          npm run verify:thirdparty
          npm run lint
          npm run biome
          npm test
          npm run test:admin-motor
          npm run typecheck:admin-motor
          npm run build
