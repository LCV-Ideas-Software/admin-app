version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 5 * * *'
      timezone: 'Etc/GMT+3'
    cooldown:
      default-days: 7
      exclude:
        - 'actions/*'
        - 'github/*'
    rebase-strategy: auto
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 5 * * *'
      timezone: 'Etc/GMT+3'
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    versioning-strategy: increase
    ignore:
      # typescript-eslint supports TypeScript only below 6.1.0.
      - dependency-name: 'typescript'
        versions:
          - '>=6.1.0'
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      vitest:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/tlsrpt-motor'
    ignore:
      # Cloudflare's Workers test integration currently requires Vitest ^4.1.0.
      # Remove after the official integration supports Vitest 5 and CI passes.
      - dependency-name: 'vitest'
        versions:
          - '>=5.0.0'
    schedule:
      interval: 'cron'
      cronjob: '0 5 * * *'
      timezone: 'Etc/GMT+3'
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
