version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
      exclude:
        - 'actions/*'
        - 'github/*'
    rebase-strategy: auto
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    open-pull-requests-limit: 10
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    versioning-strategy: increase
    ignore:
      # typescript-eslint supports TypeScript only below 6.1.0.
      - dependency-name: 'typescript'
        versions:
          - '>=6.1.0'
    open-pull-requests-limit: 10
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/tlsrpt-motor'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
