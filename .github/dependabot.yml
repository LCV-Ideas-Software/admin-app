version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '01:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7
      exclude:
        - '*'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    open-pull-requests-limit: 10
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - 'github/codeql-action*'
      codeql-action-security-updates:
        applies-to: security-updates
        patterns:
          - 'github/codeql-action*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '01:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'npm'
      - 'frontend'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    versioning-strategy: increase
    ignore:
      # typescript-eslint 8.66.0 supports TypeScript only below 6.1.0.
      - dependency-name: 'typescript'
        versions:
          - '>=6.1.0'
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      dev-dependencies:
        patterns:
          - 'eslint*'
          - 'typescript'
          - '@types/*'
          - 'wrangler'
          - '@cloudflare/*'
          - 'vite*'
          - '@vitest/*'
          - '@biomejs/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      tiptap-editor:
        patterns:
          - '@tiptap/*'
          - 'tiptap-*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      tanstack:
        patterns:
          - '@tanstack/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      eslint-ecosystem:
        patterns:
          - '@eslint/*'
          - 'eslint-plugin-*'
          - 'typescript-eslint'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 10

  - package-ecosystem: 'npm'
    directory: '/tlsrpt-motor'
    schedule:
      interval: 'daily'
      time: '01:00'
      timezone: 'America/Los_Angeles'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'npm'
      - 'worker'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    versioning-strategy: increase
    groups:
      dev-dependencies:
        patterns:
          - 'eslint*'
          - 'typescript'
          - '@types/*'
          - 'wrangler'
          - '@cloudflare/*'
          - 'vite*'
          - '@vitest/*'
          - '@biomejs/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 10
